server:
  port: 8080
  # v7.1 gzip 压缩：入口包 1.6MB → ~300KB（JS/CSS/JSON 全走压缩），局域网/VPN 均受益
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json

spring:
  application:
    name: pims-server

  # v8.4（D7）：合同 PDF 上传（Spring Boot 默认 1MB，超限报"系统异常"无提示）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # 数据源：v12.0 全面切换 PostgreSQL（唯一数据库）；URL/账号可用环境变量覆盖（生产 systemd 注入）
  datasource:
    url: ${PIMS_DB_URL:jdbc:postgresql://127.0.0.1:5432/pims}
    driver-class-name: ${PIMS_DB_DRIVER:org.postgresql.Driver}
    username: ${PIMS_DB_USER:pims}
    password: ${PIMS_DB_PASSWORD:Pims@2026pg}
    hikari:
      maximum-pool-size: 5

  # JPA 配置
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none                  # 表结构由启动脚本维护，避免元数据查询开销
    show-sql: false
    open-in-view: false              # 避免长事务占用数据库锁
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  # 静态资源
  web:
    resources:
      static-locations: classpath:/static/

# Sa-Token 配置
sa-token:
  token-name: pims-token
  timeout: 86400                    # token 有效期 24 小时
  active-timeout: 1800              # 30 分钟无操作自动下线
  is-concurrent: false              # v5.10 单点登录：同一账号仅允许一次登录，后登录自动顶掉先登录（旧 token 立即失效）
  is-share: false                   # 各端独立 token（不共享），被顶端下一次请求返回 401 跳登录页
  token-style: uuid
  is-log: false
  # v6.2 安全：token 改 HttpOnly Cookie 通道（XSS 无法窃取）——登录自动 Set-Cookie，请求自动携带；
  # header 通道保留作平滑过渡（老浏览器 localStorage 残留 token 仍可用到自然过期，新登录纯 Cookie）
  is-read-cookie: true
  is-read-header: true
  cookie:
    http-only: true                 # JS 不可读，堵 XSS 窃取
    same-site: Lax                  # 跨站 POST 不携带，基本防 CSRF（内网同源部署）
    max-age: 86400                  # 与 timeout 对齐：浏览器重开仍在，靠服务端 30 分钟活跃超时踢闲置会话


# 日志
logging:
  level:
    com.pengyuan.pims: INFO   # v9.2（P2-14 审计）：DEBUG 全量落盘含敏感业务参数；排障时临时改回 DEBUG
    org.hibernate.SQL: WARN
