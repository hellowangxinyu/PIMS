name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 运行后端测试
        working-directory: pims-server
        run: mvn test -B

  frontend:
    # v9.2（P2-11 审计）：原 CI 只跑后端——前端坏包可溜进 master；现在 lint+build 双闸
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pims-web/package-lock.json
      - name: 安装依赖
        working-directory: pims-web
        run: npm ci
      - name: ESLint 检查
        working-directory: pims-web
        run: npm run lint --if-present
      - name: 构建前端
        working-directory: pims-web
        run: npm run build
